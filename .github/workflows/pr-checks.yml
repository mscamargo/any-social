name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # sqlite3@4 builds with node-gyp, which needs distutils (removed in Python 3.12)
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test
